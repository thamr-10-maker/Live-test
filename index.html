<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Live Test – Likes & Gifts</title>
<style>
  /* ---------- Colors and basic look ---------- */
  :root {
    --bg: #0d0b14;
    --card: #1a1726;
    --text: #f4f1ff;
    --muted: #9a93b8;
    --pink: #ff3b6b;
    --gold: #ffc23d;
    --cyan: #3de0ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ---------- Setup screen (where you type username + key) ---------- */
  #setup {
    padding: 24px 20px;
    max-width: 480px;
    margin: 0 auto;
  }
  #setup h1 { font-size: 24px; margin-bottom: 6px; }
  #setup p { color: var(--muted); font-size: 14px; margin-bottom: 18px; line-height: 1.5; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  input {
    width: 100%; padding: 14px; font-size: 16px;
    border-radius: 12px; border: 1px solid #332d4a;
    background: var(--card); color: var(--text);
  }
  button {
    font-size: 16px; font-weight: 700; padding: 14px; border: 0;
    border-radius: 12px; cursor: pointer; width: 100%;
  }
  .btn-main { background: var(--pink); color: white; margin-top: 20px; }
  .btn-soft { background: var(--card); color: var(--text); margin-top: 10px; border: 1px solid #332d4a; }

  /* ---------- Live screen (what viewers see) ---------- */
  #live { display: none; min-height: 100vh; padding: 20px 16px 140px; position: relative; }

  #status {
    font-size: 13px; color: var(--muted); text-align: center; margin-bottom: 10px;
  }
  #status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #666; margin-right: 6px; }
  #status.on .dot { background: #3dff8a; }
  #disconnect-btn {
    display: block; width: auto; margin: 0 auto 6px; padding: 6px 14px;
    font-size: 13px; font-weight: 600; background: var(--card); color: var(--muted);
    border: 1px solid #332d4a; border-radius: 20px;
  }
  #status.err .dot { background: var(--pink); }

  /* Big like counter */
  #likes-box { text-align: center; margin: 20px 0 26px; }
  #heart { font-size: 90px; display: inline-block; transition: transform .12s; }
  #heart.pop { transform: scale(1.25); }
  #like-count { font-size: 56px; font-weight: 800; letter-spacing: -1px; }
  #like-label { color: var(--muted); font-size: 15px; }

  /* Gift list */
  h2 { font-size: 15px; color: var(--muted); margin: 18px 4px 10px; font-weight: 600; }
  .gift {
    display: flex; align-items: center; gap: 12px;
    background: linear-gradient(90deg, #3a2a10, var(--card));
    border-left: 4px solid var(--gold);
    padding: 12px 14px; border-radius: 12px; margin-bottom: 8px;
    animation: slideIn .35s ease-out;
  }
  .gift .icon { font-size: 30px; }
  .gift .who { font-weight: 700; }
  .gift .what { color: var(--gold); font-size: 14px; }

  /* Chat list */
  .chat {
    background: var(--card); padding: 10px 12px; border-radius: 10px;
    margin-bottom: 6px; font-size: 15px; animation: slideIn .25s ease-out;
  }
  .chat b { color: var(--cyan); }

  .follow {
    background: var(--card); padding: 10px 12px; border-radius: 10px; margin-bottom: 6px;
    font-size: 15px; border-left: 4px solid var(--cyan); animation: slideIn .25s ease-out;
  }

  /* Big pop-up when a gift arrives */
  #big-alert {
    position: fixed; left: 50%; top: 35%; transform: translate(-50%, -50%) scale(.6);
    background: var(--gold); color: #1a1200; padding: 18px 26px; border-radius: 20px;
    font-size: 22px; font-weight: 800; text-align: center; opacity: 0; pointer-events: none;
    transition: all .3s; width: 85%; max-width: 380px; box-shadow: 0 10px 40px rgba(255,194,61,.4);
  }
  #big-alert.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  /* Flying hearts */
  .fly {
    position: fixed; bottom: 120px; font-size: 28px; pointer-events: none;
    animation: flyUp 1.6s ease-out forwards;
  }

  /* Test buttons at the bottom */
  #test-bar {
    position: fixed; bottom: 0; left: 0; right: 0; padding: 10px 12px 18px;
    background: rgba(13,11,20,.95); border-top: 1px solid #2a2440;
    display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px;
  }
  #test-bar button { font-size: 13px; padding: 10px 4px; background: var(--card); color: var(--text); border: 1px solid #332d4a; }
  #test-bar .hide-btn { grid-column: span 4; font-size: 12px; padding: 6px; color: var(--muted); background: none; border: 0; }

  @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: none; } }
  @keyframes flyUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-320px) scale(1.6); }
  }
</style>
</head>
<body>

<!-- ================= SETUP SCREEN ================= -->
<div id="setup">
  <h1>🎮 Live Test</h1>
  <p>This page shows likes, gifts and chat from a TikTok LIVE, as they happen.
     Type the TikTok username that is live right now, and your Euler Stream key.</p>

  <label for="username">TikTok username (without @)</label>
  <input id="username" placeholder="example: ahmed_live" autocomplete="off" autocapitalize="off">

  <label for="apikey">Euler Stream API key</label>
  <input id="apikey" placeholder="paste your key here" autocomplete="off" autocapitalize="off">

  <button class="btn-main" id="connect-btn">Connect to LIVE</button>
  <button class="btn-soft" id="test-btn">Try test mode (no live needed)</button>
</div>

<!-- ================= LIVE SCREEN ================= -->
<div id="live">
  <div id="status"><span class="dot"></span><span id="status-text">Connecting…</span></div>
  <button id="disconnect-btn">✕ Disconnect</button>

  <div id="likes-box">
    <div id="heart">❤️</div>
    <div id="like-count">0</div>
    <div id="like-label">likes</div>
  </div>

  <h2>🎁 Gifts</h2>
  <div id="gifts"></div>

  <h2>💬 Chat</h2>
  <div id="chat"></div>
</div>

<div id="big-alert"></div>

<!-- Test buttons: pretend to be a viewer -->
<div id="test-bar" style="display:none">
  <button data-test="like">❤️ Like</button>
  <button data-test="gift">🌹 Gift</button>
  <button data-test="chat">💬 Chat</button>
  <button data-test="follow">➕ Follow</button>
  <button class="hide-btn" id="hide-test">Hide test buttons</button>
</div>

<script>
/* =========================================================
   PART 1: Remember username and key on this phone
   ========================================================= */
function save(name, value) { try { localStorage.setItem(name, value); } catch (e) {} }
function load(name) { try { return localStorage.getItem(name) || ""; } catch (e) { return ""; } }

const usernameInput = document.getElementById("username");
const apikeyInput = document.getElementById("apikey");
usernameInput.value = load("tt_username");
apikeyInput.value = load("tt_apikey");

/* =========================================================
   PART 2: Things that change the screen
   ========================================================= */
let totalLikes = 0;

function showLikes(amount) {
  totalLikes += amount;
  document.getElementById("like-count").textContent = totalLikes.toLocaleString();
  const heart = document.getElementById("heart");
  heart.classList.add("pop");
  setTimeout(() => heart.classList.remove("pop"), 120);
  // Send a few flying hearts (max 5 at once)
  for (let i = 0; i < Math.min(amount, 5); i++) {
    setTimeout(flyingHeart, i * 90);
  }
}

function flyingHeart() {
  const h = document.createElement("div");
  h.className = "fly";
  h.textContent = ["❤️", "💖", "💗", "💕"][Math.floor(Math.random() * 4)];
  h.style.left = (20 + Math.random() * 60) + "%";
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 1600);
}

function showGift(who, giftName, count) {
  const box = document.createElement("div");
  box.className = "gift";
  box.innerHTML = '<div class="icon">🎁</div><div><div class="who"></div><div class="what"></div></div>';
  box.querySelector(".who").textContent = who;
  box.querySelector(".what").textContent = "sent " + giftName + (count > 1 ? " ×" + count : "");
  addToList("gifts", box, 5);

  // Big pop-up in the middle
  const alertBox = document.getElementById("big-alert");
  alertBox.textContent = "🎁 " + who + " sent " + giftName + (count > 1 ? " ×" + count : "") + "!";
  alertBox.classList.add("show");
  clearTimeout(window._alertTimer);
  window._alertTimer = setTimeout(() => alertBox.classList.remove("show"), 2500);
}

function showChat(who, text) {
  const line = document.createElement("div");
  line.className = "chat";
  const name = document.createElement("b");
  name.textContent = who + ": ";
  line.appendChild(name);
  line.appendChild(document.createTextNode(text));
  addToList("chat", line, 6);
}

function showFollow(who) {
  const line = document.createElement("div");
  line.className = "follow";
  line.textContent = "➕ " + who + " followed!";
  addToList("chat", line, 6);
}

// Add a new item at the top, and keep only the newest few
function addToList(listId, item, maxItems) {
  const list = document.getElementById(listId);
  list.prepend(item);
  while (list.children.length > maxItems) list.lastChild.remove();
}

function setStatus(text, kind) {
  const s = document.getElementById("status");
  s.className = kind || "";
  document.getElementById("status-text").textContent = text;
}

/* =========================================================
   PART 3: Understand messages from TikTok (through Euler)
   ========================================================= */
function nameOf(user) {
  if (!user) return "Someone";
  return user.nickname || user.uniqueId || "Someone";
}

function handleEvent(type, data) {
  if (!type || !data) return;

  if (type.includes("LikeMessage")) {
    showLikes(Number(data.likeCount) || 1);
  }
  else if (type.includes("GiftMessage")) {
    // TikTok sends "combo" gifts in many small updates.
    // repeatEnd = 1 means the combo is finished, so we show it once.
    const isCombo = data.giftDetails && Number(data.giftDetails.giftType) === 1;
    if (isCombo && !Number(data.repeatEnd)) return;
    const giftName = (data.giftDetails && (data.giftDetails.giftName || data.giftDetails.name)) || data.giftName || "a gift";
    showGift(nameOf(data.user), giftName, Number(data.repeatCount) || 1);
  }
  else if (type.includes("ChatMessage")) {
    showChat(nameOf(data.user), data.comment || "");
  }
  else if (type.includes("SocialMessage")) {
    const action = String(data.action || "") + String((data.common && data.common.displayText && data.common.displayText.displayType) || "");
    if (action.toLowerCase().includes("follow")) showFollow(nameOf(data.user));
  }
}

function handleMessage(raw) {
  let msg;
  try { msg = JSON.parse(raw); } catch (e) { return; }

  // Euler may send one event, or a bundle of many events
  const list = Array.isArray(msg.messages) ? msg.messages : [msg];
  for (const m of list) {
    handleEvent(m.type, m.data);
  }
}

/* =========================================================
   PART 4: Connect to the live stream
   ========================================================= */
let socket = null;

function connect() {
  const username = usernameInput.value.trim().replace(/^@/, "");
  const apiKey = apikeyInput.value.trim();
  if (!username) { usernameInput.focus(); return; }
  save("tt_username", username);
  save("tt_apikey", apiKey);

  openLiveScreen();
  setStatus("Connecting to @" + username + "…");

  const url = "wss://ws.eulerstream.com?uniqueId=" + encodeURIComponent(username) +
              (apiKey ? "&apiKey=" + encodeURIComponent(apiKey) : "");

  try { socket = new WebSocket(url); }
  catch (e) { setStatus("Could not connect: " + e.message, "err"); return; }

  socket.onopen = () => setStatus("Connected to @" + username, "on");

  socket.onmessage = (event) => {
    if (typeof event.data === "string") handleMessage(event.data);
  };

  socket.onclose = (event) => {
    const reasons = {
      4401: "Your API key is wrong",
      4403: "Your key does not have permission",
      4404: "@" + username + " is not live right now",
      4429: "Too many connections – wait a minute",
      4005: "The live stream ended",
      4500: "TikTok closed the connection"
    };
    setStatus(reasons[event.code] || ("Disconnected (code " + event.code + ")"), "err");
  };

  socket.onerror = () => setStatus("Connection error – check your internet", "err");
}

function openLiveScreen() {
  document.getElementById("setup").style.display = "none";
  document.getElementById("live").style.display = "block";
}

/* =========================================================
   PART 5: Test mode – pretend to be viewers
   ========================================================= */
const fakeNames = ["Sara", "Omar", "Noura", "Faisal", "Lama", "Khalid"];
const fakeGifts = ["Rose", "Galaxy", "Lion", "Heart Me", "Doughnut"];
const fakeChats = ["Hello! 👋", "Nice stream", "😂😂😂", "Where are you from?", "Let's go!!"];
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

function testMode() {
  openLiveScreen();
  setStatus("Test mode – tap the buttons below", "on");
  document.getElementById("test-bar").style.display = "grid";
}

document.querySelectorAll("[data-test]").forEach((btn) => {
  btn.addEventListener("click", () => {
    const kind = btn.dataset.test;
    // We build fake messages that look like the real ones,
    // so the same code (handleEvent) is tested.
    if (kind === "like")   handleEvent("WebcastLikeMessage",   { likeCount: 1, user: { nickname: pick(fakeNames) } });
    if (kind === "gift")   handleEvent("WebcastGiftMessage",   { user: { nickname: pick(fakeNames) }, giftDetails: { giftName: pick(fakeGifts), giftType: 2 }, repeatCount: 1 });
    if (kind === "chat")   handleEvent("WebcastChatMessage",   { user: { nickname: pick(fakeNames) }, comment: pick(fakeChats) });
    if (kind === "follow") handleEvent("WebcastSocialMessage", { user: { nickname: pick(fakeNames) }, action: "follow" });
  });
});

document.getElementById("hide-test").addEventListener("click", () => {
  document.getElementById("test-bar").style.display = "none";
});

/* =========================================================
   PART 6: Disconnect and go back to the setup screen
   ========================================================= */
function disconnect() {
  if (socket) {
    socket.onclose = null;   // don't show an error message
    socket.close();
    socket = null;
  }
  totalLikes = 0;
  document.getElementById("like-count").textContent = "0";
  document.getElementById("gifts").innerHTML = "";
  document.getElementById("chat").innerHTML = "";
  document.getElementById("test-bar").style.display = "none";
  document.getElementById("live").style.display = "none";
  document.getElementById("setup").style.display = "block";
}
document.getElementById("disconnect-btn").addEventListener("click", disconnect);

document.getElementById("connect-btn").addEventListener("click", connect);
document.getElementById("test-btn").addEventListener("click", testMode);
</script>
</body>
</html>
