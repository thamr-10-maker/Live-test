<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>House of Cards – TikTok LIVE Game</title>
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
<style>
  :root {
    --bg: #0d0b14; --card: #1a1726; --text: #f4f1ff; --muted: #9a93b8;
    --pink: #ff3b6b; --gold: #ffc23d; --green: #3dff8a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 30%, #2a1f45 0%, var(--bg) 70%);
    color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }

  /* ---------- Setup screen (only the streamer sees this) ---------- */
  #setup { padding: 24px 20px; max-width: 480px; margin: 0 auto; height: 100%; overflow-y: auto; }
  #setup h1 { font-size: 26px; margin-bottom: 6px; }
  #setup p { color: var(--muted); font-size: 14px; margin-bottom: 14px; line-height: 1.5; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  input { width: 100%; padding: 14px; font-size: 16px; border-radius: 12px; border: 1px solid #332d4a; background: var(--card); color: var(--text); }
  button { font-size: 16px; font-weight: 700; padding: 14px; border: 0; border-radius: 12px; cursor: pointer; width: 100%; }
  .btn-main { background: var(--pink); color: white; margin-top: 18px; }
  .btn-soft { background: var(--card); color: var(--text); margin-top: 10px; border: 1px solid #332d4a; }

  /* ---------- Gift → weapon legend (icons only, no words) ---------- */
  .legend { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
  .chip {
    background: rgba(26,23,38,.85); border: 1px solid #2f2847; border-radius: 10px;
    padding: 4px 2px; display: flex; align-items: center; justify-content: center; gap: 2px;
    font-size: 19px; line-height: 1; white-space: nowrap;
  }
  .chip .arrow { font-size: 11px; color: var(--muted); }
  .chip .x { font-size: 10px; color: var(--muted); font-weight: 700; }
  .gicon { display: inline-flex; width: 22px; height: 22px; align-items: center; justify-content: center; }
  .gicon img { width: 22px; height: 22px; object-fit: contain; }
  .chip.hit { animation: chipHit .6s; }
  @keyframes chipHit { 0%,100% { transform: scale(1); } 40% { transform: scale(1.25); background: var(--gold); } }

  /* ---------- Game screen ---------- */
  #game { display: none; height: 100%; position: relative; }
  #world { position: absolute; left: 0; right: 0; bottom: 0; top: 0; display: flex; align-items: flex-end; justify-content: center; }
  #world canvas { width: 100% !important; height: auto !important; max-height: 100%; max-width: 100%; }
  #world.shake { animation: quake .12s linear infinite; }
  @keyframes quake {
    0% { transform: translate(0,0); } 25% { transform: translate(-7px,3px); }
    50% { transform: translate(6px,-4px); } 75% { transform: translate(-4px,-2px); } 100% { transform: translate(0,0); }
  }
  body.testing #world { bottom: 74px; }

  #hud { position: absolute; top: 0; left: 0; right: 0; padding: 8px 12px; pointer-events: none; }
  #top-row { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  #status .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #666; margin-right: 5px; }
  #status.on .dot { background: var(--green); }
  #status.err .dot { background: var(--pink); }
  #menu-btn { pointer-events: auto; width: auto; padding: 5px 12px; font-size: 13px; background: var(--card); color: var(--muted); border: 1px solid #332d4a; border-radius: 20px; }

  .bar-row { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
  .bar-row .ico { font-size: 18px; width: 22px; text-align: center; }
  .bar-row .num { font-size: 13px; font-weight: 800; min-width: 52px; text-align: right; }
  .bar { flex: 1; height: 10px; background: #251f38; border-radius: 6px; overflow: hidden; }
  .bar > div { height: 100%; width: 100%; border-radius: 6px; transition: width .3s; }
  #health-fill { background: linear-gradient(90deg, var(--pink), var(--gold)); }
  #wind-fill { background: linear-gradient(90deg, #8fd3ff, #e3f6ff); width: 0%; }

  #hud .legend { margin-top: 8px; }
  #leaders { margin-top: 8px; font-size: 13px; line-height: 1.55; }
  #leaders b { color: var(--gold); }

  /* Chat, joins and follows feed (in the empty space above the tower) */
  #feed { margin-top: 10px; display: flex; flex-direction: column; gap: 5px; align-items: flex-start; }
  .feed-line {
    max-width: 92%; background: rgba(26,23,38,.78); border: 1px solid #2f2847;
    padding: 6px 11px; border-radius: 14px; font-size: 14px; line-height: 1.35;
    animation: feedIn .3s ease-out; transition: opacity .6s; overflow-wrap: anywhere;
  }
  .feed-line .n { font-weight: 700; color: #8fd3ff; margin: 0 4px; }
  .feed-line.join { color: var(--muted); font-size: 13px; padding: 4px 10px; }
  .feed-line.join .n { color: var(--muted); }
  .feed-line.follow { border-color: var(--green); }
  .feed-line.follow .n { color: var(--green); }
  .feed-line.gone { opacity: 0; }
  @keyframes feedIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  #big-alert {
    position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.6);
    background: var(--gold); color: #1a1200; padding: 12px 18px; border-radius: 18px;
    font-size: 22px; font-weight: 800; text-align: center; opacity: 0; pointer-events: none;
    transition: all .25s; max-width: 92%; box-shadow: 0 10px 40px rgba(255,194,61,.45);
    display: flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap;
  }
  #big-alert .who { max-width: 170px; overflow: hidden; text-overflow: ellipsis; }
  #big-alert .gicon, #big-alert .gicon img { width: 30px; height: 30px; }
  #big-alert.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #big-alert.win { background: var(--pink); color: white; font-size: 26px; box-shadow: 0 10px 40px rgba(255,59,107,.5); }

  #test-bar {
    position: absolute; bottom: 0; left: 0; right: 0; padding: 6px 8px 14px;
    background: rgba(13,11,20,.95); border-top: 1px solid #2a2440;
    display: none; grid-template-columns: repeat(11, 1fr); gap: 3px;
  }
  body.testing #test-bar { display: grid; }
  #test-bar button { font-size: 16px; padding: 10px 0; background: var(--card); color: var(--text); border: 1px solid #332d4a; border-radius: 10px; }

  #menu { position: absolute; inset: 0; background: rgba(13,11,20,.9); display: none; align-items: center; justify-content: center; }
  #menu > div { width: 80%; max-width: 320px; }
</style>
</head>
<body>

<!-- ================= SETUP SCREEN ================= -->
<div id="setup">
  <h1>🃏 House of Cards</h1>
  <p>Viewers attack your tower. Likes make wind. Each gift is a different weapon. Bigger gift = bigger weapon.</p>
  <div class="legend" id="setup-legend"></div>

  <label for="username">TikTok username (without @)</label>
  <input id="username" placeholder="example: ahmed_live" autocomplete="off" autocapitalize="off">

  <label for="apikey">Euler Stream API key</label>
  <input id="apikey" placeholder="paste your key here" autocomplete="off" autocapitalize="off">

  <button class="btn-main" id="connect-btn">Start game on LIVE</button>
  <button class="btn-soft" id="test-btn">Try test mode</button>
</div>

<!-- ================= GAME SCREEN ================= -->
<div id="game">
  <div id="world"></div>

  <div id="hud">
    <div id="top-row">
      <div id="status"><span class="dot"></span><span id="status-text"></span></div>
      <button id="menu-btn">☰</button>
    </div>
    <div class="bar-row"><span class="ico">🃏</span><div class="bar"><div id="health-fill"></div></div><span class="num" id="health-text">100%</span></div>
    <div class="bar-row"><span class="ico">💨</span><div class="bar"><div id="wind-fill"></div></div><span class="num" id="wind-text">0/50</span></div>
    <div class="legend" id="game-legend"></div>
    <div id="leaders"></div>
    <div id="feed"></div>
  </div>

  <div id="big-alert"></div>

  <div id="test-bar"></div>

  <div id="menu">
    <div>
      <button class="btn-soft" id="rebuild-btn">🔄 Rebuild tower</button>
      <button class="btn-soft" id="toggle-test-btn">🧪 Show / hide test buttons</button>
      <button class="btn-soft" id="disconnect-btn">✕ Disconnect</button>
      <button class="btn-main" id="close-menu-btn">Back to game</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   SETTINGS – change these to tune the game
   ========================================================= */
const LIKES_PER_PUFF = 50;     // how many likes make one puff of wind
const LEVELS = 6;              // floors in the tower
const DESTROYED_AT = 0.15;     // tower is "destroyed" when only 15% is left

// Which gift fires which weapon.
// name = the gift's name in TikTok, coins = its price, icon = picture shown until we see the real gift picture.
const WEAPONS = [
  { gift: "Rose",         coins: 1,    icon: "🌹", weapon: "rock",       emoji: "🪨" },
  { gift: "Finger Heart", coins: 5,    icon: "🫰", weapon: "arrow",      emoji: "🏹" },
  { gift: "Doughnut",     coins: 30,   icon: "🍩", weapon: "bomb",       emoji: "💣" },
  { gift: "Hand Hearts",  coins: 100,  icon: "🫶", weapon: "rocket",     emoji: "🚀" },
  { gift: "Corgi",        coins: 299,  icon: "🐶", weapon: "tornado",    emoji: "🌪️" },
  { gift: "Money Gun",    coins: 500,  icon: "💸", weapon: "meteor",     emoji: "☄️" },
  { gift: "Galaxy",       coins: 1000, icon: "🌌", weapon: "earthquake", emoji: "🌍" },
];

/* =========================================================
   PART 1: Gift pictures + the legend on screen
   ========================================================= */
// When a real gift arrives we remember its picture, so the legend shows the real TikTok gift.
let giftPics = {};
try { giftPics = JSON.parse(localStorage.getItem("gift_pics") || "{}"); } catch (e) {}
function rememberPic(name, url) {
  if (!name || !url || giftPics[name.toLowerCase()] === url) return;
  giftPics[name.toLowerCase()] = url;
  try { localStorage.setItem("gift_pics", JSON.stringify(giftPics)); } catch (e) {}
  drawLegends();
}

// Makes a small gift picture (real picture if we have it, otherwise the emoji)
function giftIcon(name, fallbackEmoji, urlNow) {
  const span = document.createElement("span");
  span.className = "gicon";
  const url = urlNow || giftPics[(name || "").toLowerCase()];
  if (url) {
    const img = document.createElement("img");
    img.src = url; img.alt = "";
    img.onerror = () => { span.textContent = fallbackEmoji || "🎁"; };
    span.appendChild(img);
  } else {
    span.textContent = fallbackEmoji || "🎁";
  }
  return span;
}

function makeChip(left, rightEmoji, id) {
  const chip = document.createElement("div");
  chip.className = "chip";
  if (id) chip.dataset.weapon = id;
  chip.appendChild(left);
  const arrow = document.createElement("span"); arrow.className = "arrow"; arrow.textContent = "➜";
  chip.appendChild(arrow);
  chip.appendChild(document.createTextNode(rightEmoji));
  return chip;
}

function drawLegends() {
  for (const id of ["setup-legend", "game-legend"]) {
    const box = document.getElementById(id);
    box.innerHTML = "";
    // Likes chip:  ❤️×50 ➜ 💨
    const likes = document.createElement("span");
    likes.innerHTML = '❤️<span class="x">×' + LIKES_PER_PUFF + '</span>';
    box.appendChild(makeChip(likes, "💨", "wind"));
    for (const w of WEAPONS) box.appendChild(makeChip(giftIcon(w.gift, w.icon), w.emoji, w.weapon));
  }
}
drawLegends();

function flashChip(weaponId) {
  const chip = document.querySelector('#game-legend [data-weapon="' + weaponId + '"]');
  if (!chip) return;
  chip.classList.remove("hit"); void chip.offsetWidth; chip.classList.add("hit");
}

/* =========================================================
   PART 2: The physics world (Matter.js does the falling)
   ========================================================= */
const { Engine, Render, Runner, Bodies, Body, Composite, Events } = Matter;
const W = 400, H = 720, GROUND_Y = 700;

const engine = Engine.create({ positionIterations: 10, velocityIterations: 8 });
const render = Render.create({
  element: document.getElementById("world"),
  engine: engine,
  options: { width: W, height: H, wireframes: false, background: "transparent",
             pixelRatio: Math.min(window.devicePixelRatio || 1, 2) }
});
Composite.add(engine.world, Bodies.rectangle(W / 2, GROUND_Y + 20, W * 3, 40,
  { isStatic: true, render: { fillStyle: "#2a2140" } }));

let cards = [];

function makeCard(x, y, w, h, isRoof) {
  const c = Bodies.rectangle(x, y, w, h, {
    friction: 1, frictionStatic: 2, restitution: 0, density: 0.002, slop: 0.02,
    chamfer: { radius: 1 },
    render: { fillStyle: isRoof ? "#f3ead6" : "#fdfaf2", strokeStyle: "#c0283c", lineWidth: 1.5 }
  });
  Body.setStatic(c, true);   // locked in place until something hits it
  c.released = false; c.restsOn = []; c.holdsUp = [];
  return c;
}
function supports(top, bottom) { top.restsOn.push(bottom); bottom.holdsUp.push(top); }

// Unlock a card so it falls. Everything resting on it falls too.
function release(c) {
  if (c.released) return;
  c.released = true;
  Body.setStatic(c, false);
  Body.setAngularVelocity(c, (Math.random() - .5) * 0.05);
  for (const up of c.holdsUp) setTimeout(() => release(up), 60 + Math.random() * 120);
}
// Unlock and throw a card
function hit(c, vx, vy, spin) {
  release(c);
  Body.setVelocity(c, { x: vx, y: vy });
  Body.setAngularVelocity(c, spin != null ? spin : (Math.random() - .5) * 0.3);
}

function buildTower() {
  clearTimeout(rebuildTimer);
  for (const c of cards) Composite.remove(engine.world, c);
  cards = [];
  const STAND_H = 46, STAND_W = 9, ROOF_W = 58, ROOF_H = 6, ROOM_GAP = 60, FLOOR_H = STAND_H + ROOF_H;
  for (let level = 0; level < LEVELS; level++) {
    const rooms = LEVELS - level;
    const startX = W / 2 - ((rooms - 1) * ROOM_GAP) / 2;
    const baseY = GROUND_Y - level * FLOOR_H;
    for (let r = 0; r < rooms; r++) {
      const cx = startX + r * ROOM_GAP;
      const left  = makeCard(cx - 22, baseY - STAND_H / 2, STAND_W, STAND_H, false);
      const right = makeCard(cx + 22, baseY - STAND_H / 2, STAND_W, STAND_H, false);
      const roof  = makeCard(cx, baseY - STAND_H - ROOF_H / 2, ROOF_W, ROOF_H, true);
      for (const c of [left, right, roof]) { c.level = level; c.isRoof = (c === roof); cards.push(c); }
      supports(roof, left); supports(roof, right);
      for (const s of [left, right]) {
        const below = cards.find(b => b.isRoof && b.level === level - 1 && Math.abs(b.position.x - s.position.x) < ROOF_W / 2);
        if (below) supports(s, below);
      }
    }
  }
  Composite.add(engine.world, cards);
  towerDown = false;
  updateHealth();
}

/* =========================================================
   PART 3: Tower health
   ========================================================= */
let towerDown = false, lastHitter = null, rebuildTimer = null;
const standing = () => cards.filter(c => !c.released);

function updateHealth() {
  const ratio = cards.length ? standing().length / cards.length : 0;
  const pct = Math.round(ratio * 100);
  document.getElementById("health-fill").style.width = pct + "%";
  document.getElementById("health-text").textContent = pct + "%";
  if (!towerDown && cards.length && ratio <= DESTROYED_AT) {
    towerDown = true;
    const box = alertBox(true);
    box.appendChild(document.createTextNode("🏆"));
    const who = document.createElement("span"); who.className = "who"; who.textContent = lastHitter || "";
    box.appendChild(who);
    box.appendChild(document.createTextNode("🃏💥"));
    rebuildTimer = setTimeout(buildTower, 4500);
  }
}
setInterval(updateHealth, 250);

// Remove cards that flew off the screen (keeps the phone fast)
Events.on(engine, "afterUpdate", () => {
  for (const c of cards) {
    if (c.released && (c.position.y > H + 200 || c.position.x < -300 || c.position.x > W + 300)) {
      Composite.remove(engine.world, c);
    }
  }
});

function randomStanding(fromLevel, toLevel) {
  let pool = standing().filter(c => c.level >= fromLevel && c.level <= toLevel);
  if (!pool.length) pool = standing();
  return pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
}

/* =========================================================
   PART 4: Weapons
   Each weapon is an emoji that flies across the screen.
   ========================================================= */
const flyers = [];   // things flying on screen right now
const booms = [];    // explosion rings

function blast(x, y, radius, power) {
  booms.push({ x, y, radius, start: performance.now() });
  for (const c of cards) {
    const dx = c.position.x - x, dy = c.position.y - y;
    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
    if (dist > radius) continue;
    const s = power * (1 - dist / radius);
    hit(c, (dx / dist) * s + (Math.random() - .5) * 2, (dy / dist) * s - s * 0.4);
  }
}

// Add a flying emoji. It moves from (x0,y0) to (x1,y1) in "ms" milliseconds.
function fly(o) {
  flyers.push(Object.assign({ start: performance.now(), size: 40, arc: 0, angle: 0 }, o));
}

const weaponActions = {
  wind() {
    const top = standing().sort((a, b) => a.position.y - b.position.y)[0];
    if (!top) return;
    const dir = Math.random() < .5 ? -1 : 1;
    fly({ emoji: "💨", x0: dir > 0 ? -40 : W + 40, y0: top.position.y, x1: top.position.x, y1: top.position.y,
          ms: 450, size: 42, flip: dir < 0,
          onHit: () => { for (const c of standing()) if (c.level === top.level && Math.abs(c.position.x - top.position.x) < 40) hit(c, dir * 3, -1, dir * 0.08); } });
  },
  rock() {   // 🪨 thrown in an arc, small hit near the top
    const t = randomStanding(LEVELS - 3, LEVELS); if (!t) return;
    const fromLeft = Math.random() < .5;
    fly({ emoji: "🪨", x0: fromLeft ? -30 : W + 30, y0: 200, x1: t.position.x, y1: t.position.y,
          ms: 700, arc: 120, size: 34, spin: true, onHit: () => blast(t.position.x, t.position.y, 40, 6) });
  },
  arrow() {  // 🏹 flies straight through one floor, knocks the first few cards it touches
    const t = randomStanding(3, LEVELS - 1); if (!t) return;
    const dir = Math.random() < .5 ? 1 : -1;
    fly({ emoji: "🏹", x0: dir > 0 ? -40 : W + 40, y0: t.position.y, x1: dir > 0 ? W + 40 : -40, y1: t.position.y,
          ms: 900, size: 38, flip: dir < 0, pierce: 3, dir: dir });
  },
  bomb() {   // 💣 falls from the sky onto the upper middle
    const t = randomStanding(3, 4); if (!t) return;
    fly({ emoji: "💣", x0: t.position.x, y0: -40, x1: t.position.x, y1: t.position.y,
          ms: 900, size: 40, onHit: () => blast(t.position.x, t.position.y, 60, 8) });
  },
  rocket() { // 🚀 flies in from the side into the lower middle
    const t = randomStanding(2, 2); if (!t) return;
    const dir = Math.random() < .5 ? 1 : -1;
    fly({ emoji: "🚀", x0: dir > 0 ? -50 : W + 50, y0: t.position.y - 60, x1: t.position.x, y1: t.position.y,
          ms: 750, size: 46, rotate: dir > 0 ? Math.PI / 4 : -Math.PI * 3 / 4, trail: true,
          onHit: () => blast(t.position.x, t.position.y, 90, 12) });
  },
  tornado() { // 🌪️ sweeps across and lifts everything above the 2nd floor
    const dir = Math.random() < .5 ? 1 : -1;
    fly({ emoji: "🌪️", x0: dir > 0 ? -60 : W + 60, y0: GROUND_Y - 160, x1: dir > 0 ? W + 60 : -60, y1: GROUND_Y - 160,
          ms: 2200, size: 110, wobble: true, sweep: 2, dir: dir });
  },
  meteor() { // ☄️ falls from the corner, huge blast low in the tower
    const t = randomStanding(1, 1); if (!t) return;
    const fromRight = Math.random() < .5;
    fly({ emoji: "☄️", x0: fromRight ? W + 60 : -60, y0: -80, x1: t.position.x, y1: t.position.y,
          ms: 1000, size: 70, flip: !fromRight, trail: true,
          onHit: () => blast(t.position.x, t.position.y, 170, 16) });
  },
  earthquake() { // 🌍 the whole screen shakes and every card falls
    const world = document.getElementById("world");
    world.classList.add("shake");
    fly({ emoji: "🌍", x0: W / 2, y0: H * 0.45, x1: W / 2, y1: H * 0.45, ms: 1600, size: 120, pulse: true });
    const list = standing().sort((a, b) => a.level - b.level);
    list.forEach((c, i) => setTimeout(() => hit(c, (Math.random() - .5) * 10, -Math.random() * 6), i * 15));
    setTimeout(() => world.classList.remove("shake"), 1600);
  },
};

// Draw flying emojis + explosion rings every frame
Events.on(render, "afterRender", () => {
  const ctx = render.context, now = performance.now();

  for (let i = flyers.length - 1; i >= 0; i--) {
    const f = flyers[i];
    const p = Math.min(1, (now - f.start) / f.ms);
    let x = f.x0 + (f.x1 - f.x0) * p;
    let y = f.y0 + (f.y1 - f.y0) * p - Math.sin(Math.PI * p) * f.arc;
    if (f.wobble) y += Math.sin(now / 80) * 8;

    // Arrow: knock the first few cards it touches
    if (f.pierce) {
      for (const c of standing()) {
        if (f.pierce <= 0) break;
        if (Math.abs(c.position.y - y) < 26 && Math.abs(c.position.x - x) < 14) { hit(c, f.dir * 7, -2); f.pierce--; }
      }
    }
    // Tornado: lift every card it passes above floor "sweep"
    if (f.sweep != null) {
      for (const c of standing()) {
        if (c.level >= f.sweep && Math.abs(c.position.x - x) < 34) hit(c, f.dir * 5, -7 - Math.random() * 4, f.dir * 0.4);
      }
    }

    // Trail of sparks for rockets and meteors
    if (f.trail) {
      ctx.beginPath(); ctx.arc(x - (f.x1 - f.x0) * 0.04, y - (f.y1 - f.y0) * 0.04, f.size * 0.35, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,150,40,0.35)"; ctx.fill();
    }

    ctx.save();
    ctx.translate(x, y);
    if (f.rotate) ctx.rotate(f.rotate);
    if (f.spin) ctx.rotate(now / 90);
    if (f.flip) ctx.scale(-1, 1);
    const size = f.pulse ? f.size * (1 + 0.15 * Math.sin(now / 60)) : f.size;
    ctx.globalAlpha = f.pulse ? 1 - p * 0.6 : 1;
    ctx.font = size + "px serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(f.emoji, 0, 0);
    ctx.restore();

    if (p >= 1) { flyers.splice(i, 1); if (f.onHit) f.onHit(); }
  }

  for (let i = booms.length - 1; i >= 0; i--) {
    const b = booms[i], t = (now - b.start) / 500;
    if (t > 1) { booms.splice(i, 1); continue; }
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius * (0.3 + t * 0.7), 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,194,61," + (0.35 * (1 - t)) + ")"; ctx.fill();
    ctx.lineWidth = 4 * (1 - t); ctx.strokeStyle = "rgba(255,59,107," + (1 - t) + ")"; ctx.stroke();
  }
});

/* =========================================================
   PART 5: Viewers → weapons
   ========================================================= */
let windLikes = 0;
const leaders = {};

function onLikes(name, amount) {
  if (towerDown) return;
  windLikes += amount;
  while (windLikes >= LIKES_PER_PUFF) {
    windLikes -= LIKES_PER_PUFF;
    lastHitter = name;
    weaponActions.wind();
    flashChip("wind");
  }
  document.getElementById("wind-fill").style.width = (windLikes / LIKES_PER_PUFF * 100) + "%";
  document.getElementById("wind-text").textContent = windLikes + "/" + LIKES_PER_PUFF;
}

// Find the weapon for a gift: by its name first, otherwise by its price
function weaponFor(giftName, coinsEach) {
  const n = (giftName || "").toLowerCase().replace(/s$/, "");
  const byName = WEAPONS.find(w => w.gift.toLowerCase().replace(/s$/, "") === n);
  if (byName) return byName;
  let pick = WEAPONS[0];
  for (const w of WEAPONS) if (coinsEach >= w.coins) pick = w;
  return pick;
}

function onGift(name, giftName, coinsEach, count, picUrl) {
  rememberPic(giftName, picUrl);
  leaders[name] = (leaders[name] || 0) + coinsEach * count;
  showLeaders();
  const w = weaponFor(giftName, coinsEach);

  // Alert: [name] [gift picture] ×count ➜ [weapon]
  const box = alertBox(false);
  const who = document.createElement("span"); who.className = "who"; who.textContent = name;
  box.appendChild(who);
  box.appendChild(giftIcon(giftName, w.icon, picUrl));
  if (count > 1) box.appendChild(document.createTextNode("×" + count));
  box.appendChild(document.createTextNode("➜ " + w.emoji));
  flashChip(w.weapon);

  if (towerDown) return;
  lastHitter = name;
  // Combo gifts fire the weapon several times (max 5 so the screen stays readable)
  const shots = Math.min(count, 5);
  for (let i = 0; i < shots; i++) setTimeout(() => { if (!towerDown) weaponActions[w.weapon](); }, i * 450);
}

/* =========================================================
   PART 6: Screen messages
   ========================================================= */
function alertBox(isWin) {
  const a = document.getElementById("big-alert");
  a.innerHTML = "";
  a.className = "show" + (isWin ? " win" : "");
  clearTimeout(window._alertTimer);
  window._alertTimer = setTimeout(() => a.className = "", isWin ? 4000 : 2200);
  return a;
}

function showLeaders() {
  const top = Object.entries(leaders).sort((a, b) => b[1] - a[1]).slice(0, 3);
  const medals = ["🥇", "🥈", "🥉"];
  const box = document.getElementById("leaders");
  box.innerHTML = "";
  top.forEach(([name, coins], i) => {
    const line = document.createElement("div");
    line.textContent = medals[i] + " " + name + "  ";
    const b = document.createElement("b"); b.textContent = "🪙" + coins;
    line.appendChild(b); box.appendChild(line);
  });
}

function setStatus(text, kind) {
  document.getElementById("status").className = kind || "";
  document.getElementById("status-text").textContent = text;
}

/* =========================================================
   PART 6b: Chat / join / follow feed
   ========================================================= */
const FEED_MAX = 6;          // how many lines to show at once
const FEED_SECONDS = 10;     // how long a line stays
let lastJoinTime = 0;

function addFeed(kind, icon, name, text) {
  const feed = document.getElementById("feed");
  const line = document.createElement("div");
  line.className = "feed-line " + kind;
  line.dir = "auto";                       // Arabic shows right-to-left correctly
  line.appendChild(document.createTextNode(icon));
  const n = document.createElement("span"); n.className = "n"; n.textContent = name;
  line.appendChild(n);
  if (text) line.appendChild(document.createTextNode(text));
  feed.appendChild(line);
  while (feed.children.length > FEED_MAX) feed.firstChild.remove();
  setTimeout(() => line.classList.add("gone"), FEED_SECONDS * 1000);
  setTimeout(() => line.remove(), FEED_SECONDS * 1000 + 700);
}

function onChat(name, text) { if (text && text.trim()) addFeed("chat", "💬", name, text); }
function onFollow(name) { addFeed("follow", "➕", name, ""); }
function onJoin(name) {
  // In busy lives many people join at once, so show at most one join per second
  const now = Date.now();
  if (now - lastJoinTime < 1000) return;
  lastJoinTime = now;
  addFeed("join", "👋", name, "");
}

/* =========================================================
   PART 7: Reading TikTok messages
   ========================================================= */
function nameOf(user) { return (user && (user.nickname || user.uniqueId)) || "?"; }

function picOf(d) {
  const img = d.giftImage || d.image || d.icon || {};
  return (img.url && img.url[0]) || (img.urlList && img.urlList[0]) || (img.url_list && img.url_list[0]) || "";
}

function handleEvent(type, data) {
  if (!type || !data) return;
  if (type.includes("LikeMessage")) {
    onLikes(nameOf(data.user), Number(data.likeCount) || 1);
  } else if (type.includes("ChatMessage")) {
    onChat(nameOf(data.user), data.comment);
  } else if (type.includes("MemberMessage")) {
    onJoin(nameOf(data.user));
  } else if (type.includes("SocialMessage")) {
    const action = String(data.action || "") + String((data.common && data.common.displayText && data.common.displayText.displayType) || "");
    if (action.toLowerCase().includes("follow")) onFollow(nameOf(data.user));
  } else if (type.includes("GiftMessage")) {
    const d = data.giftDetails || {};
    if (Number(d.giftType) === 1 && !Number(data.repeatEnd)) return;   // wait until a combo finishes
    onGift(nameOf(data.user), d.giftName || d.name || "", Number(d.diamondCount) || 1,
           Number(data.repeatCount) || 1, picOf(d));
  }
}

function handleMessage(raw) {
  let msg; try { msg = JSON.parse(raw); } catch (e) { return; }
  const list = Array.isArray(msg.messages) ? msg.messages : [msg];
  for (const m of list) handleEvent(m.type, m.data);
}

/* =========================================================
   PART 8: Connect / test / menu
   ========================================================= */
function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }
const usernameInput = document.getElementById("username");
const apikeyInput = document.getElementById("apikey");
usernameInput.value = load("tt_username");
apikeyInput.value = load("tt_apikey");

let socket = null, started = false;

function startGame() {
  document.getElementById("setup").style.display = "none";
  document.getElementById("game").style.display = "block";
  if (!started) { started = true; Render.run(render); Runner.run(Runner.create(), engine); }
  buildTower();
}

function connect() {
  const username = usernameInput.value.trim().replace(/^@/, "");
  const apiKey = apikeyInput.value.trim();
  if (!username) { usernameInput.focus(); return; }
  save("tt_username", username); save("tt_apikey", apiKey);
  startGame();
  setStatus("@" + username + " …");
  const url = "wss://ws.eulerstream.com?uniqueId=" + encodeURIComponent(username) + (apiKey ? "&apiKey=" + encodeURIComponent(apiKey) : "");
  try { socket = new WebSocket(url); } catch (e) { setStatus("✕", "err"); return; }
  socket.onopen = () => setStatus("@" + username, "on");
  socket.onmessage = (e) => { if (typeof e.data === "string") handleMessage(e.data); };
  socket.onclose = (e) => {
    const reasons = { 4401: "Wrong API key", 4404: "@" + username + " is not live", 4429: "Too many connections", 4005: "Live ended" };
    setStatus(reasons[e.code] || "Disconnected (" + e.code + ")", "err");
  };
  socket.onerror = () => setStatus("Connection error", "err");
}

// Test buttons: one per weapon
const fakeNames = ["Sara", "Omar", "Noura", "Faisal", "Lama", "Khalid"];
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const testBar = document.getElementById("test-bar");
function addTestBtn(label, fn) { const b = document.createElement("button"); b.textContent = label; b.onclick = fn; testBar.appendChild(b); }
addTestBtn("❤️", () => handleEvent("WebcastLikeMessage", { likeCount: 10, user: { nickname: pick(fakeNames) } }));
for (const w of WEAPONS) {
  addTestBtn(w.emoji, () => handleEvent("WebcastGiftMessage", {
    user: { nickname: pick(fakeNames) }, giftDetails: { giftName: w.gift, diamondCount: w.coins, giftType: 2 }, repeatCount: 1 }));
}
addTestBtn("💬", () => handleEvent("WebcastChatMessage", { user: { nickname: pick(fakeNames) }, comment: pick(["هلا والله 👋", "اكسر البرج 😂", "Let's go!!", "وش هالبرج 🔥", "صاروخ صاروخ 🚀"]) }));
addTestBtn("👋", () => handleEvent("WebcastMemberMessage", { user: { nickname: pick(fakeNames) } }));
addTestBtn("🔄", buildTower);

function testMode() {
  startGame();
  setStatus("🧪", "on");
  document.body.classList.add("testing");
}

const menu = document.getElementById("menu");
document.getElementById("menu-btn").onclick = () => menu.style.display = "flex";
document.getElementById("close-menu-btn").onclick = () => menu.style.display = "none";
document.getElementById("rebuild-btn").onclick = () => { buildTower(); menu.style.display = "none"; };
document.getElementById("toggle-test-btn").onclick = () => { document.body.classList.toggle("testing"); menu.style.display = "none"; };
document.getElementById("disconnect-btn").onclick = () => {
  if (socket) { socket.onclose = null; socket.close(); socket = null; }
  menu.style.display = "none";
  document.body.classList.remove("testing");
  document.getElementById("game").style.display = "none";
  document.getElementById("setup").style.display = "block";
};
document.getElementById("connect-btn").onclick = connect;
document.getElementById("test-btn").onclick = testMode;
</script>
